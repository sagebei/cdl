<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CDL — Condorcet Domain Library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="vio" x1="64" y1="80" x2="192" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="teal" x1="64" y1="176" x2="192" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="blue" x1="64" y1="128" x2="192" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="60" fill="url(#bg)"/>

  <!-- casing color matches background midtone so crossings read as an over/under weave -->
  <g stroke-linecap="round" fill="none">
    <!-- strand A: top -> bottom (violet) -->
    <path d="M64 80 C 116 80, 140 176, 192 176" stroke="#13203a" stroke-width="24"/>
    <path d="M64 80 C 116 80, 140 176, 192 176" stroke="url(#vio)" stroke-width="13"/>

    <!-- strand B: bottom -> top (teal) -->
    <path d="M64 176 C 116 176, 140 80, 192 80" stroke="#13203a" stroke-width="24"/>
    <path d="M64 176 C 116 176, 140 80, 192 80" stroke="url(#teal)" stroke-width="13"/>

    <!-- strand C: middle -> middle (blue), woven on top at the centre -->
    <path d="M64 128 L 192 128" stroke="#13203a" stroke-width="24"/>
    <path d="M64 128 L 192 128" stroke="url(#blue)" stroke-width="13"/>
  </g>

  <!-- endpoint nodes: same colours, reordered left vs right => visual permutation -->
  <g>
    <circle cx="64" cy="80"  r="11" fill="#A78BFA"/>
    <circle cx="64" cy="128" r="11" fill="#60A5FA"/>
    <circle cx="64" cy="176" r="11" fill="#2DD4BF"/>
    <circle cx="192" cy="80"  r="11" fill="#22D3EE"/>
    <circle cx="192" cy="128" r="11" fill="#3B82F6"/>
    <circle cx="192" cy="176" r="11" fill="#7C3AED"/>
  </g>
</svg>
